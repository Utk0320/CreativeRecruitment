services:
  # 1. Backend API (Web Service)
  - type: web
    name: creativerecruitment-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_PATH
        value: ./database/creativerecruit.db
      - key: TIMEZONE
        value: Asia/Kolkata
      - key: COOKIE_SAME_SITE
        value: none
      - key: COOKIE_SECURE
        value: "true"
      - key: SSO_PROVIDER
        value: none
      - key: EMAIL_PROVIDER
        value: smtp
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: FRONTEND_URL
        fromService:
          type: web
          name: creativerecruitment-frontend
          property: url
      - key: CORS_ORIGIN
        fromService:
          type: web
          name: creativerecruitment-frontend
          property: url

  # 2. Frontend SPA (Static Site)
  - type: web
    name: creativerecruitment-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
